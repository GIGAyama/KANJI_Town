<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy（このページが読み書きしてよい相手を、ここに書いたものだけに絞る）。
      GitHub Pages は応答ヘッダを足せないので meta で置く（frame-ancestors と report-uri は meta では効かない）。
      - script-src 'self'   … 同梱した JS だけ。インラインの script 要素と onclick 属性は動かない
      - style-src 'unsafe-inline' … React が <style> 要素を作る箇所（App.jsx・WatchMode.jsx）があるため
      - img-src data: blob: … Tailwind の任意値が data: の SVG を出す・書き出しで blob を使う
      - connect-src         … 「4けたの数字で送る」の仲介サーバー（PeerJS 公開サーバー）。
                               STUN/TURN（stun.l.google.com・*.turn.peerjs.com）は CSP の対象外。
                               値は src/hooks/usePeerJS.js の PEER_OPTIONS と合わせること
      - frame-src           … 学習ログを記録ボックス（まなびクエスト）へ写す iframe（public/records-hub-client.js）
      開発サーバー（npm run dev）では vite.config.js が外す（Vite が開発用のインライン script を入れるため）。
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com; frame-src https://gamification.giga-school.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <!-- インストールの合図（beforeinstallprompt）を、ほかの読み込みより先に受け取る。中身は install-hook.js -->
    <script src="./install-hook.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Android WebView / Mi Browser等の強制ダークモードによる自動反転で
         書き順・手書きの線が背景と同化して見えなくなるのを防ぐ -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ef4444" />
    <meta name="description" content="漢字を覚えて街をつくろう！小学生向け漢字学習アプリ" />
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="GIGA school">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:title" content="マイ漢字タウン">
    <meta property="og:description" content="漢字を覚えて街をつくろう！小学生向け漢字学習アプリ">
    <meta property="og:url" content="https://kanji-town.giga-school.com/">
    <meta property="og:image" content="https://giga-school.com/assets/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="GIGA school｜学校で使える Web アプリ">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="漢字タウン" />
    <link rel="manifest" href="./manifest.json" />

    <link rel="icon" href="./favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
    <!-- iOS は maskable を解釈しないため、角丸なしの専用画像を渡す -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <title>マイ漢字タウン</title>
    <!-- 書体は外から読まない。src/fonts/（src/index.css から取りこむ）に同梱している。 -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- 学習ログを記録ハブ（まなびクエスト）へ写す。読むだけで、このアプリの記録には触れない -->
    <script src="./records-hub-client.js" defer></script>

    <!-- 利用規約・プライバシーへの行き先。中身は正本の部品
         standards/web/giga-app-links.js（配布物 public/giga-app-links.js）が、
         src/components/ui/Footer.jsx に置いた <span data-giga-links> の中に出す。
         data-links は置き場所の側に書いてある。 -->
    <script src="./giga-app-links.js" defer></script>
  </body>
</html>
