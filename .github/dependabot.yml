version: 2
updates:
  # 依存の更新はひと月に一度まとめて受け取る。
  # 学期中に毎週 PR が飛ぶと確認が追いつかず、かえって放置されるため。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # React 本体とビルドツールは相互に依存するため、ばらばらに上げず束ねる
      react:
        patterns:
          - react
          - react-dom
      build-tools:
        patterns:
          - vite
          - "@vitejs/*"
          - tailwindcss
          - "@tailwindcss/*"
    # メジャー更新は破壊的変更を含むため自動では上げない（人間が判断する）
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
